[project]
name = "jbs"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "click>=8.0",
    "rich>=13.0",
    "requests>=2.31",
    "markdownify>=0.11",
]

[project.optional-dependencies]
enrich = ["anthropic>=0.40"]
vector = [
    "sqlite-vec>=0.1.6",
    "fastembed>=0.8",
    "mlx-embedding-models>=0.0.11",
    "einops",
]

[tool.setuptools.packages.find]
include = ["jbs*"]

[project.scripts]
jbs = "jbs.cli:main"
